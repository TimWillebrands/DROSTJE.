[workspace]
members = ["crates/*"]
exclude = ["mobile"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
libc = "0.2"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
parking_lot = "0.12"
rmpv = "=1.3.1"
rusqlite = { version = "0.38", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
thiserror = "2"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
qrcodegen = "1.8.0"
rqrr = "0.11.0"
uuid = { version = "1", features = ["v4", "serde", "v5"] }
servo = { version = "=0.7.0", default-features = false, features = ["bundled", "js_jit", "multiprocess", "webcrypto", "webgpu"] }
content-security-policy = { version = "=0.9.0", default-features = false }
dpi = "0.1"
euclid = "0.22"
stylo_static_prefs = "=0.22.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
drostje-diff = { path = "crates/diff" }
drostje-file-refs = { path = "crates/file-refs" }
drostje-model = { path = "crates/model" }
drostje-platform = { path = "crates/platform" }
drostje-titles = { path = "crates/titles" }
drostje-tracker = { path = "crates/tracker" }
drostje-worktrees = { path = "crates/worktrees" }
drostje-factory = { path = "crates/factory" }
drostje-neovim = { path = "crates/neovim" }
drostje-network = { path = "crates/network" }
drostje-store = { path = "crates/store" }
drostje-fonts = { path = "crates/fonts" }
drostje-browser = { path = "crates/browser" }
drostje-browser-tools = { path = "crates/browser-tools" }
drostje-harness = { path = "crates/harness" }
drostje-remote = { path = "crates/remote" }
drostje-ntfy = { path = "crates/ntfy" }
drostje-phone = { path = "crates/phone" }
drostje-themes = { path = "crates/themes" }

[package]
name = "drostje"
version.workspace = true
edition.workspace = true
default-run = "drostje"

[features]
runtime-qa = ["gpui-kit/test-support", "ghostty-terminal/runtime-qa"]

[[bin]]
name = "drostje"
path = "src/main.rs"

[dependencies]
drostje-diff.workspace = true
drostje-file-refs.workspace = true
drostje-model.workspace = true
drostje-platform = { workspace = true, features = ["desktop"] }
drostje-titles.workspace = true
drostje-tracker.workspace = true
drostje-worktrees.workspace = true
drostje-store.workspace = true
drostje-network.workspace = true
drostje-factory.workspace = true
drostje-neovim.workspace = true
drostje-fonts.workspace = true
drostje-browser.workspace = true
drostje-browser-tools = { workspace = true, features = ["browser"] }
drostje-harness.workspace = true
drostje-remote = { workspace = true, features = ["browser"] }
drostje-phone.workspace = true
drostje-themes.workspace = true
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "fbc3ebf145d0d4593c883271f8ac7a7e6b74c6d6", version = "=0.8.1" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
async-channel.workspace = true
smol.workspace = true
image.workspace = true
ghostty-terminal = { version = "0.1.0", path = "crates/ghostty-terminal" }
url.workspace = true
log.workspace = true

[dev-dependencies]
base64.workspace = true
drostje-ntfy = { workspace = true, features = ["test-server"] }

[[test]]
name = "markdown_rendering"
harness = false
required-features = ["runtime-qa"]

[[test]]
name = "job_notices"
harness = false
required-features = ["runtime-qa"]

[[test]]
name = "servo_rendering"
harness = false
required-features = ["runtime-qa"]

[[test]]
name = "servo_workspace"
harness = false
required-features = ["runtime-qa"]

[[test]]
name = "servo_content_process"
harness = false
required-features = ["runtime-qa"]

[[test]]
name = "native_terminal_input"
harness = false
required-features = ["runtime-qa"]

[patch.crates-io]
zed-font-kit = { path = "vendor/zed-font-kit" }
stylo_derive = { path = "vendor/stylo_derive" }
servo-webgpu = { path = "vendor/servo-webgpu" }
servo-constellation = { path = "vendor/servo-constellation" }
gpui-fast-web = { path = "vendor/gpui-fast-web" }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.naga]
opt-level = 3

[profile.dev.package.wgpu-core]
opt-level = 3
