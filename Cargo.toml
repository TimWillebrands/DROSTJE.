[package]
name = "drostje"
version = "0.1.0"
edition = "2024"

[features]
runtime-qa = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = "=0.6.6"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
async-channel = "2"
smol = "2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
base64 = "0.22"
rmpv = "=1.3.1"
parking_lot = "0.12"
ghostty-terminal = { version = "0.1.0", path = "crates/ghostty-terminal" }
url = "2"
servo = { version = "=0.7.0", default-features = false, features = ["bundled", "js_jit", "multiprocess", "webcrypto", "webgpu"] }
dpi = "0.1"
euclid = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
content-security-policy = { version = "=0.9.0", default-features = false }
stylo_static_prefs = "=0.22.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }

[[test]]
name = "markdown_rendering"
harness = false
required-features = ["runtime-qa"]

[[test]]
name = "servo_rendering"
harness = false
required-features = ["runtime-qa"]

[[test]]
name = "servo_workspace"
harness = false
required-features = ["runtime-qa"]

# Owns `main` because Servo re-executes the test binary as its content processes.
[[test]]
name = "servo_content_process"
harness = false
required-features = ["runtime-qa"]

# Keep GPUI pinned while sharing Servo's FreeType ABI. The vendored crate changes
# only its FreeType dependency requirements; both upstream licenses are retained.
[patch.crates-io]
zed-font-kit = { path = "vendor/zed-font-kit" }
# GPUI's log/serde features expose another From<_> for fmt::Error. Constrain the
# generated CSS result type instead of relying on a unique conversion.
stylo_derive = { path = "vendor/stylo_derive" }
# WebGPU fixes, each marked "DROSTJE patch"; the MPL-2.0 notices are retained.
# `web_exposed_limits` clamps raw driver binding counts (524288 samplers on
# Vulkan, from which PixiJS sizes its batch shader) to WebGPU's defaults.
# `WebGpuExternalImages::lock` never hands WebRender fewer bytes than a
# descriptor it may still upload with, which panicked when a canvas shrank.
# Destroyed canvases keep their external image id, so a frame built before the
# image deletion locks as `Invalid` instead of panicking the painter. Messages
# for a gone device are ignored, and per-document threads (below) start via
# `start_webgpu_thread_for_document`.
servo-webgpu = { path = "vendor/servo-webgpu" }
# Upstream shares one WebGPU thread per site, so a navigated-away document's
# GPU devices live until script collects them, which it never does; after about
# ten, device creation fails and panics the shared thread. The vendored copy runs
# one WebGPU thread per document and exits it with the pipeline (search
# "DROSTJE patch"); the MPL-2.0 notice is retained. Pages run in content
# processes: one that exits while its pages are open is reported as a crash of
# those pages (upstream only reaps it), and on Linux children re-execute
# /proc/self/exe so an update installed while DROSTJE runs cannot break them.
servo-constellation = { path = "vendor/servo-constellation" }

# Servo's generated DOM bindings make debug symbols disproportionately large.
[profile.dev]
debug = 0
incremental = false

# WebGPU compiles every page shader through naga on Servo's WebGPU thread while
# script waits synchronously; unoptimized, a shader-heavy page stalls for minutes.
[profile.dev.package.naga]
opt-level = 3

[profile.dev.package.wgpu-core]
opt-level = 3
