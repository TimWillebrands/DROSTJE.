[package]
name = "drost"
version = "0.1.0"
edition = "2024"

[features]
runtime-qa = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = "=0.6.1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
async-channel = "2"
smol = "2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
rmpv = "=1.3.1"
parking_lot = "0.12"
