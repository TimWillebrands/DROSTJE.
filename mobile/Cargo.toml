[package]
name = "drostje-mobile"
description = "DROSTJE. for Android: follow the Spaces and Threads of a paired desktop."
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "drostje_mobile"
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = "1"
async-channel = "2"
drostje-phone = { path = "../crates/phone", features = ["scan"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "ae6a3fdfef416e7040e773415ac9cbd8c623e5d5", default-features = false, features = ["component", "assets"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "7548ebc4b24f00494af9976af8852c7163ded9ce", default-features = false }
jni = "0.22"

[dev-dependencies]
drostje-ntfy = { path = "../crates/ntfy", features = ["test-server"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "ae6a3fdfef416e7040e773415ac9cbd8c623e5d5", default-features = false, features = ["component", "assets", "test-support"] }

[[test]]
name = "screens"
harness = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.phone]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
panic = "unwind"
strip = false
debug = "line-tables-only"
